<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>FIREFLY PROJECT</title>
  <style>
    :root {
      --bg: #05070b;
      --fg: #9ff7bf;
      --muted: #6dd79a;
      --panel: #0d141d;
      --line: #1f3248;
      --warn: #f3b35e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 700px at 20% 10%, #0b1320 0%, transparent 60%),
        radial-gradient(900px 600px at 90% 90%, #101a10 0%, transparent 55%),
        var(--bg);
      color: var(--fg);
      font: 16px/1.5 Consolas, "Courier New", monospace;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0e1722, var(--panel));
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(20px, 4vw, 28px);
      letter-spacing: 0.08em;
    }
    p { margin: 10px 0; }
    .muted { color: var(--muted); }
    .warn { color: var(--warn); }
    code {
      background: #0b1119;
      border: 1px solid #203449;
      border-radius: 6px;
      padding: 2px 6px;
      color: #c4ffd5;
    }
  </style>
</head>
<body>
  <main class="card" id="view" aria-live="polite">
    <h1>FIREFLY PROJECT</h1>
    <p>Ce n'est pas ici.</p>
    <p class="muted">Tu as trouve une porte. Pas encore la bonne cle.</p>
    <p class="warn">Indice: la cle finale fait exactement <code>32</code> caracteres hexadecimaux.</p>
    <p class="muted">- FF</p>
  </main>

  <script>
    (function () {
      "use strict";

      var EXPECTED_MD5 = "3c503cbe615bda8c5608e52855d571d7";
      var rawHash = window.location.hash || "";

      // Strict fragment validation: exactly one leading # and 32 lowercase hex chars.
      // Then exact equality with the expected MD5 value.
      var strictFormat = /^#[0-9a-f]{32}$/;
      if (!strictFormat.test(rawHash)) {
        return;
      }

      var candidate = rawHash.slice(1);
      if (candidate !== EXPECTED_MD5) {
        return;
      }

      window.location.replace("./memoire.html#" + EXPECTED_MD5);
    })();
  </script>
</body>
</html>
