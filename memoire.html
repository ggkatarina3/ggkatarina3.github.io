  <title>FIREFLY PROJECT - Transmission Finale</title>
  <style>
    :root {
      --bg: #020406;
      --fg: #8df5b5;
      --muted: #6fd99e;
      --line: #1f3045;
      --panel: #0a121a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1000px 700px at 10% 5%, #0a1220 0%, transparent 65%),
        radial-gradient(900px 600px at 90% 85%, #0f1a0f 0%, transparent 60%),
        var(--bg);
      color: var(--fg);
      font: 16px/1.55 Consolas, "Courier New", monospace;
      padding: 24px;
    }
    .wrap {
      width: min(920px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #0c141f, var(--panel));
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(20px, 4.5vw, 30px);
      letter-spacing: 0.08em;
    }
    pre {
      margin: 14px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.85;
      font-size: 0.95rem;
      color: #bdfed3;
    }
    .sig { margin-top: 12px; color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var EXPECTED_MD5 = "3c503cbe615bda8c5608e52855d571d7";
      var rawHash = window.location.hash || "";

      // Strict fragment validation before revealing any final content.
      var strictFormat = /^#[0-9a-f]{32}$/;
      var valid = strictFormat.test(rawHash) && rawHash.slice(1) === EXPECTED_MD5;

      if (!valid) {
        window.location.replace("./index.html");
        return;
      }

      document.getElementById("victory").classList.remove("hidden");
    })();

</html>
